    <!-- No preload here any more. This line used to preload the hero still,
         because the hero background was a custom property and so nothing in the
         markup pointed at it and the browser could not find it until it had
         parsed the CSS. The backdrop is a <video> with a poster attribute in the
         body now, so both are discoverable by the parser and neither needs
         telling. Preloading the video instead was considered and rejected: it
         would fetch 1.3MB for the readers who asked for reduced motion and are
         only ever going to see the poster. -->
    <!-- Blocking on purpose: decides before first paint whether the
         English markup is about to be translated. See the file. -->

<div class="hero__bg" aria-hidden="true"></div>
<!-- The hero backdrop is a video: a 10-second seamless loop of the blue ribbon,
     at 960x540 and 1.3MB, sitting in the layer the still photograph used to
     occupy. Nothing about the layer changed — same z-index, same mask, same
     dimming — so the only difference on the page is that the pixels move.

     VP9 in WebM and nothing else. An H.264 fallback at a size worth shipping
     (369KB) bands visibly across the smooth dark-blue falloff, which is the one
     thing this footage is made of, and a browser that cannot play VP9 gets the
     poster instead — which is frame 0 of this same file, so the fallback is the
     artwork rather than a different picture.

     autoplay is deliberately absent and preload is "none". main.js calls play()
     only when the reader has not asked for reduced motion, so someone who would
     be shown a still anyway never downloads 1.3MB to be shown that still. With
     JavaScript off the poster is the whole of it, which is a finished page and
     not a broken one.

     muted and playsinline are both required for autoplay to be permitted at all
     on iOS and on Android; neither is about this video, which has no audio
     track to begin with (the encode is -an).

     aria-hidden because it is decoration: there is nothing in it a screen
     reader could be told that the page does not already say in text. -->
<video class="hero__photo" data-hero-video aria-hidden="true" muted loop playsinline
       preload="none" poster="img/hero-bg-poster.webp">
    <source src="img/hero-bg-loop.webm" type="video/webm">
</video>
<div class="hero__scrim" aria-hidden="true"></div>

<a href="#main" class="sr-only" data-i18n="aria.skip">Skip to content</a>

<main id="main">
    <section class="hero hero--brand">
        <div class="container hero__brand">
            <h1 class="hero__mark hero__mark--art">
                <!-- The smiley carries no name of its own, so the name is set as
                     type underneath it and this h1 takes its name from that text.
                     The artwork is decoration, marked as such rather than
                     described as the site's name.

                     Typed out in caps rather than set with text-transform, because
                     the caps are what a screen reader has to work from and not all
                     of them apply the transform. Untranslated, as on the
                     consulting hero's eyebrow: a proper noun reads the same in
                     both languages. -->
                <img src="img/tf-smiley-chrome-transparent.webp"
                     alt="" aria-hidden="true"
                     width="1200" height="553" decoding="async">
                <span class="hero__name">TRUE FRIENDS</span>
            </h1>

            <p class="hero__lede" data-i18n="hero.lede">A creative and technical studio &amp; consulting firm based in Motala, Sweden, but available worldwide.</p>

            <div class="hero__cta hero__cta--row">
                <a class="btn" href="https://consulting.truefriends.se/"
                   target="_blank" rel="noopener">
                    <span data-i18n="hero.consulting">Consulting</span>
                    <!-- Decorative: the accessible announcement is the sr-only text
                         after it. An icon alone does not tell a screen-reader user
                         that a new tab is about to open. -->
                    <svg class="btn__external" viewBox="0 0 24 24" fill="none"
                         stroke="currentColor" stroke-width="2" stroke-linecap="square"
                         aria-hidden="true">
                        <path d="M14 4h6v6"/><path d="M20 4 11 13"/>
                        <path d="M18 14v5a1 1 0 0 1-1 1H5a1 1 0 0 1-1-1V7a1 1 0 0 1 1-1h5"/>
                    </svg>
                    <span class="sr-only" data-i18n="aria.newTab">(opens in a new tab)</span>
                </a>
                <a class="btn" href="https://studio.truefriends.se/"
                   target="_blank" rel="noopener">
                    <span data-i18n="hero.studio">Studio</span>
                    <!-- Decorative: the accessible announcement is the sr-only text
                         after it. An icon alone does not tell a screen-reader user
                         that a new tab is about to open. -->
                    <svg class="btn__external" viewBox="0 0 24 24" fill="none"
                         stroke="currentColor" stroke-width="2" stroke-linecap="square"
                         aria-hidden="true">
                        <path d="M14 4h6v6"/><path d="M20 4 11 13"/>
                        <path d="M18 14v5a1 1 0 0 1-1 1H5a1 1 0 0 1-1-1V7a1 1 0 0 1 1-1h5"/>
                    </svg>
                    <span class="sr-only" data-i18n="aria.newTab">(opens in a new tab)</span>
                </a>
            </div>
        </div>
    </section>
</main>

<!-- The switcher sits between the hero and the email rather than down in
     the footer: it reads as chrome for the address below it, and the footer
     proper is then the socials and the copyright. -->
<div class="langs" role="group" aria-label="Switch language" data-i18n-aria-label="aria.langSwitch">
    <button type="button" class="langs__btn" data-lang="en" aria-pressed="true">EN</button>
    <span class="langs__divider" aria-hidden="true">/</span>
    <button type="button" class="langs__btn" data-lang="sv" aria-pressed="false">SV</button>
</div>

<a class="email-row landing-email" href="mailto:hello@truefriends.se">
    <span>hello@truefriends.se</span>
</a>

<footer class="site-footer">
    <div class="socials-row" role="group" aria-label="Social links" data-i18n-aria-label="aria.socialLinks">
        <a class="social" data-href="https://www.linkedin.com/" target="_blank" rel="noopener" aria-label="LinkedIn" aria-disabled="true">
            <svg viewBox="0 0 24 24" fill="currentColor" aria-hidden="true"><use href="#icon-linkedin"/></svg>
        </a>
        <a class="social" data-href="https://www.instagram.com/" target="_blank" rel="noopener" aria-label="Instagram" aria-disabled="true">
            <svg viewBox="0 0 24 24" fill="currentColor" aria-hidden="true"><use href="#icon-instagram"/></svg>
        </a>
        <a class="social" data-href="https://www.youtube.com/" target="_blank" rel="noopener" aria-label="YouTube" aria-disabled="true">
            <svg viewBox="0 0 24 24" fill="currentColor" aria-hidden="true"><use href="#icon-youtube"/></svg>
        </a>
    </div>

    <p class="site-footer__copyright" data-i18n="footer.copyright">&copy; True Friends 2026</p>
</footer>
